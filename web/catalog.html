<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catalog · Shelfmark</title>
  <meta name="description" content="Search the Shelfmark catalogue, reserve titles that are out, renew loans and track fines." />
  <meta name="theme-color" content="#f4efe7" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="theme.css" />
  <!-- registered before the first paint: a page fade cut short by a quick second click would otherwise log an error -->
  <script>addEventListener("pagereveal", (e) => e.viewTransition?.ready.catch(() => null));</script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="logo" href="/"><span class="logo__mark">✦</span>SHELFMARK</a>
    <nav class="tabs topnav" id="tabs" aria-label="Catalog">
      <a class="tab" href="#browse"><i class="ph ph-magnifying-glass"></i>Browse</a>
      <a class="tab" href="#shelf"><i class="ph ph-books"></i>My shelf<span class="badge" id="shelf-badge" hidden></span></a>
    </nav>
    <div class="who" id="who"></div>
  </header>

  <main class="page" id="main">
    <div class="page-head">
      <div>
        <p class="eyebrow" id="kicker">The catalogue</p>
        <h1 class="headline" id="heading">Find your next <em>book</em>.</h1>
      </div>
    </div>

    <section class="view" id="view-browse">
      <div id="strip"></div>
      <form class="search" id="search-form" role="search">
        <label class="searchbox">
          <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
          <input type="search" name="q" placeholder="Search by title, author or ISBN" autocomplete="off" aria-label="Search the catalogue" />
        </label>
        <input type="hidden" name="subject" />
        <div class="chips" id="subjects" role="group" aria-label="Subject">
          <button type="button" class="chip" data-subject="" aria-pressed="true">All subjects</button>
        </div>
        <div class="search__row">
          <p class="search__count" id="count" aria-live="polite">Searching…</p>
          <div class="search__filters">
            <details class="menu" id="published">
              <summary class="chip menu__button"><i class="ph ph-calendar-blank" aria-hidden="true"></i><span id="published-label">Any year</span><i class="ph ph-caret-down" aria-hidden="true"></i></summary>
              <div class="menu__panel">
                <button type="button" class="menu__option" data-years="" aria-pressed="true">Any year</button>
                <button type="button" class="menu__option" data-years="-:1899">Classics <small>before 1900</small></button>
                <button type="button" class="menu__option" data-years="1900:1999">20th century <small>1900 – 1999</small></button>
                <button type="button" class="menu__option" data-years="2000:-">Modern <small>2000 onwards</small></button>
                <div class="menu__custom">
                  <label class="field">From year<input class="input input--sm" type="number" name="year_from" placeholder="e.g. 1950" inputmode="numeric" /></label>
                  <label class="field">To year<input class="input input--sm" type="number" name="year_to" placeholder="e.g. 2000" inputmode="numeric" /></label>
                  <p class="menu__hint" id="years-hint">Type a range, like 1950 to 2000.</p>
                </div>
              </div>
            </details>
            <select class="input input--sm" name="sort" aria-label="Sort by">
              <option value="title">A–Z</option>
              <option value="-year">Newest first</option>
              <option value="year">Oldest first</option>
              <option value="new">Recently added</option>
            </select>
            <label class="check"><input type="checkbox" name="available" value="true" /> On the shelf now</label>
          </div>
        </div>
      </form>
      <div class="books" id="results">
        <span class="ghost"></span><span class="ghost"></span><span class="ghost"></span><span class="ghost"></span><span class="ghost"></span><span class="ghost"></span>
        <span class="ghost"></span><span class="ghost"></span><span class="ghost"></span><span class="ghost"></span><span class="ghost"></span><span class="ghost"></span>
      </div>
      <div class="more"><button type="button" class="btn btn--ghost" id="more" hidden>Show more</button></div>
    </section>

    <section class="view" id="view-shelf" hidden></section>
  </main>

  <dialog class="sheet" id="book-sheet" aria-labelledby="book-title">
    <button type="button" class="sheet__x" data-close aria-label="Close"><i class="ph ph-x"></i></button>
    <div class="sheet__body" id="book-body" tabindex="-1" autofocus></div>
  </dialog>

  <dialog class="sheet sheet--narrow" id="account" aria-labelledby="account-h">
    <button type="button" class="sheet__x" data-close aria-label="Close"><i class="ph ph-x"></i></button>
    <div class="sheet__body">
      <p class="eyebrow">Shelfmark members</p>
      <h2 class="sheet__h" id="account-h">Your library <em>card</em></h2>
      <div class="tabs tabs--sm sheet__tabs" role="group" aria-label="Sign in or join">
        <button type="button" class="tab" data-pane="signin" aria-pressed="true">Sign in</button>
        <button type="button" class="tab" data-pane="join" aria-pressed="false">Join</button>
      </div>
      <form class="form" id="signin-form">
        <label class="field">Email or card number<input class="input" name="login" autocomplete="username" required placeholder="you@college.edu or LIB10001" /></label>
        <label class="field">Password<input class="input" name="password" type="password" autocomplete="current-password" required /></label>
        <p class="form-error" role="alert"></p>
        <button class="btn btn--lg">Sign in</button>
      </form>
      <form class="form" id="join-form" hidden>
        <label class="field">Full name<input class="input" name="name" autocomplete="name" required minlength="2" maxlength="120" /></label>
        <label class="field">Email<input class="input" name="email" type="email" autocomplete="email" required maxlength="160" /></label>
        <label class="field">Password<input class="input" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="8 characters or more" /></label>
        <p class="form-error" role="alert"></p>
        <button class="btn btn--lg">Get my card</button>
      </form>
      <div class="demo">Try a demo card:
        <button type="button" class="chip" data-demo="student@shelfmark.test">Student</button>
        <button type="button" class="chip" data-demo="faculty@shelfmark.test">Faculty</button>
        <span class="demo__staff">Library staff? <a class="link" href="/admin">Sign in to Shelfmark Admin →</a></span>
      </div>
    </div>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
  <script src="shared.js"></script>
  <script src="catalog.js"></script>
</body>
</html>
